# ============================================================
# PUSATPERIZINAN.COM — Deploy Otomatis ke Hostinger (Node.js App)
# ------------------------------------------------------------
# Alur (mirip Vercel):
#   git push → GitHub Actions BUILD (RAM 7 GB, bukan di Hostinger!)
#   → bundle standalone di-upload via FTPS → Passenger restart otomatis
#
# SECRETS YANG HARUS DIISI (GitHub → Settings → Secrets → Actions):
#   FTP_SERVER      host FTP dari hPanel (mis. srv123.hstgr.io)
#   FTP_USERNAME    username FTP (mis. u123456789)
#   FTP_PASSWORD    password FTP
#   FTP_SERVER_DIR  folder Application root, HARUS diakhiri "/"
#                   (mis. /home/u123456789/domains/pusatperizinan.com/nodeapp/)
#   Opsional (SSH): SSH_HOST, SSH_USERNAME, SSH_KEY atau SSH_PASSWORD, SSH_PORT
# ============================================================
name: Deploy ke Hostinger

on:
  push:
    branches: [main]
  workflow_dispatch: {}

concurrency:
  group: deploy-hostinger
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
    steps:
      - name: Checkout kode
        uses: actions/checkout@v4

      - name: Pasang Bun (mengikuti bun.lock)
        uses: oven-sh/setup-bun@v2

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Generate Prisma Client
        run: bunx prisma generate

      # RAM 7 GB di runner GitHub — build yang selalu gagal di Hostinger
      # berjalan di sini dengan nyaman.
      - name: Build Next.js (standalone production)
        run: bun run build
        env:
          NEXT_TELEMETRY_DISABLED: 1

      - name: Rangkai bundle deploy
        run: |
          mkdir -p deploy-bundle/.deploy deploy-bundle/tmp
          cp -a .next/standalone/. deploy-bundle/
          cp deploy/start-passenger.cjs deploy-bundle/start-passenger.cjs
          cp prisma/schema.prisma deploy-bundle/.deploy/schema.prisma
          cp scripts/remote-setup.sh deploy-bundle/.deploy/remote-setup.sh
          date +%s%N > deploy-bundle/tmp/restart.txt
          echo "Ukuran bundle: $(du -sh deploy-bundle | cut -f1)"

      - name: Upload bundle ke Hostinger (FTPS)
        uses: SamKirkland/FTP-Deploy-UpAction@v4.3.5
        with:
          server: ${{ secrets.FTP_SERVER }}
          username: ${{ secrets.FTP_USERNAME }}
          password: ${{ secrets.FTP_PASSWORD }}
          port: ${{ secrets.FTP_PORT || '21' }}
          protocol: ${{ secrets.FTP_PROTOCOL || 'ftps' }}
          local-dir: deploy-bundle/
          server-dir: ${{ secrets.FTP_SERVER_DIR }}
          # JANGAN pernah sentuh data produksi berikut saat pembersihan:
          dangerous-clean-skip: |
            db/**
            .env*
            tmp/**
            crash.log
            logs/**

      # Deploy pertama atau saat schema.prisma berubah — opsional.
      # Bisa juga dijalankan manual: hPanel → Terminal → bash .deploy/remote-setup.sh
      - name: Setup DB + restart via SSH (opsional)
        if: env.SSH_HOST != ''
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USERNAME }}
          key: ${{ secrets.SSH_KEY }}
          password: ${{ secrets.SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT || '22' }}
          script: cd ${{ secrets.FTP_SERVER_DIR }} && bash .deploy/remote-setup.sh

      - name: Ringkasan
        run: |
          echo "✅ Build & upload selesai."
          echo "→ Upload tmp/restart.txt otomatis me-restart aplikasi Passenger."
          echo "→ Buka domain Anda untuk verifikasi. Jika 502, jalankan"
          echo "  'bash .deploy/remote-setup.sh' dari hPanel Terminal, lalu cek crash.log."
